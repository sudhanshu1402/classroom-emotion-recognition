<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="SPAAC, classroom emotion recognition, shown as a camera viewfinder. One face box reads STUDENT_03, present, attentive; another reads UNKNOWN, not enrolled. Logs name, emotion, attendance and timestamp to CSV with OpenCV, dlib and a Keras CNN trained on FER2013. College project, phase-1 prototype, never deployed." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
